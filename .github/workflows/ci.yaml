name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}
  pull_request:
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox
        run: pipx install tox
      - name: Run linters
        run: tox run -e lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox
        run: pipx install tox
      - name: Run tests
        run: tox run -e unit

  build:
    name: Build charm
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v41.1.0
    with:
      cache: false

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        system:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
        tox-environments:
          - integration-charm
          - integration-metastore
          - integration-auth
          - integration-observability
          - integration-tls
          - integration-ha
          - integration-external-access
          - integration-dynamic-allocation
          - integration-iceberg
          - integration-provider
          - integration-trust

        exclude:
          - tox-environments: integration-charm # No ARM build for zk
            system:
              os: ubuntu-22.04-arm
              arch: arm64

          - tox-environments: integration-observability # No ARM build for obs charms
            system:
              os: ubuntu-22.04-arm
              arch: arm64

          - tox-environments: integration-ha # No ARM build for zk
            system:
              os: ubuntu-22.04-arm
              arch: arm64

          - tox-environments: integration-external-access # No ARM build for zk
            system:
              os: ubuntu-22.04-arm
              arch: arm64

    name: ${{ matrix.tox-environments }} (${{ matrix.system.arch }})
    needs:
      - lint
      - unit-test
      - build
    runs-on: ${{ matrix.system.os }}
    timeout-minutes: 120
    steps:
      - name: (GitHub hosted) Free up disk space
        shell: bash
        run: |
          printf '\nDisk usage before cleanup\n'
          df --human-readable
          # Based on https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
          rm -r /usr/share/dotnet
          rm -r /opt/hostedtoolcache/
          printf '\nDisk usage after cleanup\n'
          df --human-readable

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup operator environment
        # TODO: Replace with custom image on self-hosted runner
        uses: charmed-kubernetes/actions-operator@main
        with:
          juju-channel: 3.6/stable
          bootstrap-options: "--agent-version 3.6.9"
          provider: microk8s
          channel: 1.32-strict/stable
          microk8s-group: snap_microk8s
          microk8s-addons: "rbac hostpath-storage dns metallb:10.64.140.43-10.64.140.49"

      - name: Setup microceph
        id: microceph
        run: |
          sudo snap install microceph
          sudo microceph cluster bootstrap
          sudo microceph disk add loop,1G,3
          sudo microceph enable rgw
          sudo microceph.radosgw-admin user create --uid test --display-name test --access-key=foo --secret-key=bar
          echo -e "S3_SERVER_URL=http://$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc'):80/\nS3_ACCESS_KEY=foo\nS3_SECRET_KEY=bar" > .env

      - name: Download packed charm(s)
        uses: actions/download-artifact@v7
        with:
          artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
          merge-multiple: true
      - id: cache-images
        name: Cache Images Locally
        run: |
          # Download images for avoiding time out
          IMAGES=(
           $(yq '.resources.kyuubi-image.upstream-source' metadata.yaml)
           $(python3 -c "from src.constants import JOB_OCI_IMAGE;print(JOB_OCI_IMAGE, end='')")
          )

          for IMAGE in "${IMAGES[@]}"; do
            docker pull $IMAGE
            docker save $IMAGE -o image.tar
            sudo microk8s ctr images import --base-name $IMAGE image.tar
            docker rmi $IMAGE
            rm image.tar
          done

      - name: Select tests
        id: select-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]
          then
            echo Running unstable and stable tests
            echo "mark_expression=" >> $GITHUB_OUTPUT
          else
            echo Skipping unstable tests
            echo "mark_expression=not unstable" >> $GITHUB_OUTPUT
          fi

      - name: Run integration tests
        run: tox run -e ${{ matrix.tox-environments }} -- -m '${{ steps.select-tests.outputs.mark_expression }}' --keep-models
        env:
          CI_PACKED_CHARMS: ${{ needs.build.outputs.charms }}

      - name: Collect logs if job failed
        if: ${{ failure() }}
        run: |
          juju-crashdump

          # get pods
          kubectl get pods -A

          # replay juju-debug logs
          sudo snap install yq
          for model in $(juju models --format yaml | yq '.models[] | .name');
          do
            echo "Model: $model"
            if [[ ${model} != *"controller"* ]];then
              juju debug-log --model $model --replay
            fi
          done

          # events
          kubectl events -A
          echo "Done"

  test-refresh:
    strategy:
      fail-fast: false
      matrix:
        multi: ["--refresh-multi-units", ""]
        tls: ["--refresh-tls", ""]
        image: ["--refresh-image", ""]
        metastore: ["--refresh-metastore", ""]
    name: Refresh ${{ matrix.multi }} ${{ matrix.tls }} ${{ matrix.image }} ${{ matrix.metastore }}
    needs:
      - lint
      - unit-test
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: (GitHub hosted) Free up disk space
        shell: bash
        run: |
          printf '\nDisk usage before cleanup\n'
          df --human-readable
          # Based on https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
          rm -r /usr/share/dotnet
          rm -r /opt/hostedtoolcache/
          printf '\nDisk usage after cleanup\n'
          df --human-readable

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup operator environment
        # TODO: Replace with custom image on self-hosted runner
        uses: charmed-kubernetes/actions-operator@main
        with:
          juju-channel: 3.6/stable
          bootstrap-options: "--agent-version 3.6.9"
          provider: microk8s
          channel: 1.32-strict/stable
          microk8s-group: snap_microk8s
          microk8s-addons: "rbac hostpath-storage dns"

      - name: Setup microceph
        id: microceph
        run: |
          sudo snap install microceph
          sudo microceph cluster bootstrap
          sudo microceph disk add loop,1G,3
          sudo microceph enable rgw
          sudo microceph.radosgw-admin user create --uid test --display-name test --access-key=foo --secret-key=bar
          echo -e "S3_SERVER_URL=http://$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc'):80/\nS3_ACCESS_KEY=foo\nS3_SECRET_KEY=bar" > .env

      - name: Download packed charm(s)
        uses: actions/download-artifact@v7
        with:
          artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
          merge-multiple: true

      - id: cache-images
        name: Cache Images Locally
        run: |
          # Download images for avoiding time out
          IMAGES=(
           $(yq '.resources.kyuubi-image.upstream-source' metadata.yaml)
           $(python3 -c "from src.constants import JOB_OCI_IMAGE;print(JOB_OCI_IMAGE, end='')")
           "ghcr.io/canonical/charmed-spark-kyuubi@sha256:e2029c6976fc5b9ee2865eced632ca42ce554039d9832af20dfa3e63113e00f7" # rev 112 charm OCI resource
           "ghcr.io/canonical/charmed-spark@sha256:f1f944369108c0b0112212fb0242f3c314dfad362926c234857029f13c5de2c0" # rev 112 job OCI resource
          )

          for IMAGE in "${IMAGES[@]}"; do
            docker pull $IMAGE
            docker save $IMAGE -o image.tar
            sudo microk8s ctr images import --base-name $IMAGE image.tar
            docker rmi $IMAGE
            rm image.tar
          done

      - name: Run inplace upgrade tests
        run: tox run -e integration-refresh -- ${{ matrix.multi }} ${{ matrix.tls }} ${{ matrix.image }} ${{ matrix.metastore }} --keep-models
        env:
          CI_PACKED_CHARMS: ${{ needs.build.outputs.charms }}

      - name: Collect logs if job failed
        if: ${{ failure() }}
        run: |
          juju-crashdump

          # get pods
          kubectl get pods -A

          # replay juju-debug logs
          sudo snap install yq
          for model in $(juju models --format yaml | yq '.models[] | .name');
          do
            echo "Model: $model"
            if [[ ${model} != *"controller"* ]];then
              juju debug-log --model $model --replay
            fi
          done

          # events
          kubectl events -A
          echo "Done"
