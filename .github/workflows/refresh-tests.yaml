name: Inplace refresh tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  collect-refresh-test:
    name: Collect refresh test spread jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.collect-jobs.outputs.jobs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up spread
        run: |
          sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest
      - name: Collect spread jobs
        id: collect-jobs
        shell: python
        run: |
          import json
          import os
          import pathlib
          import subprocess

          spread_jobs = (
              subprocess.run(
                  [pathlib.Path.home() / "go/bin/spread", "-list", "github-ci"],
                  capture_output=True,
                  check=True,
                  text=True,
              )
              .stdout.strip()
              .split("\n")
          )

          jobs = []
          for job in spread_jobs:
              parts = job.split(":")
              # Refresh tasks have variants: "github-ci:system:spread/integration-refresh:variant"
              if len(parts) != 4:
                  continue
              _, runner, task, variant = parts
              task_name = task.removeprefix("spread/")

              if task_name != "integration-refresh":
                  continue

              # Refresh tests only run on amd64 for now
              if runner != "ubuntu-22.04":
                  continue

              name = f"{task_name}:{variant}"
              name_in_artifact = f"{task_name}-{variant}"
              jobs.append({
                  "spread_job": job,
                  "name": name,
                  "name_in_artifact": name_in_artifact,
                  "runner": runner,
              })

          output = f"jobs={json.dumps(jobs)}"
          print(output)
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(output)

  refresh-test:
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.collect-refresh-test.outputs.jobs) }}
    name: ${{ matrix.job.name }}
    needs:
      - collect-refresh-test
    runs-on: ${{ matrix.job.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up spread
        run: |
          sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest

      - name: Download packed charm(s)
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true

      - name: Run spread job
        timeout-minutes: 110
        id: spread
        run: ~/go/bin/spread -vv '${{ matrix.job.spread_job }}'

      - name: snap list
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: snap list

      - name: Select model
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        id: juju-switch
        run: |
          # sudo needed since spread runs scripts as root
          # "testing" is the default model created by concierge
          sudo juju switch testing
          mkdir ~/logs/

      - name: juju status
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: sudo juju status --color --relations | tee ~/logs/juju-status.txt

      - name: juju debug-log
        timeout-minutes: 3
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: sudo juju debug-log --color --replay --no-tail | tee ~/logs/juju-debug-log.txt

      - name: Disk usage
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: df --human-readable

      - name: Upload logs
        timeout-minutes: 2
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.job.name_in_artifact }}
          path: ~/logs/
