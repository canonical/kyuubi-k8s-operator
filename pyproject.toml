[tool.poetry]
name = "kyuubi-k8s-operator"
version = "1.0"
description = "kyuubi-k8s-operator"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
ops = "^3.8.1"
boto3 = ">=1.43.80"
lightkube = ">=1.0.1"
psycopg2 = "^2.9.12"
tenacity = ">=9.1.4"
charm-refresh = "^3.1.0.0"
httpx = "^0.28.1"
charmlibs-interfaces-certificate-transfer = "^1.0.0"

[tool.poetry.group.charm-libs.dependencies]
ops = "^3.2.0"
poetry-core = "*"
# dataplatform_libs/v0/data_model.py requires pydantic <2
pydantic = "^1.10.17, <2"
# grafana, loki, prometheus
pyyaml = "^6.0.1"
# prometheus, loki
cosl = "*"
# tls_certificates_interface/v4/tls_certificates.py
cryptography = ">=43.0.0"
jsonschema = "*"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = ">=0.16.4"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.16.4"
codespell = ">=2.4.3"
mypy = "^2.3.1"
types-psycopg2 = "^2.9.21.20250318"
types-pyyaml = "^6.0.12.20250402"
types-requests = "^2.32.0.20250328"
types-boto3 = { extras = ["essentials"], version = ">=1.43.80" }

[tool.poetry.group.unit]
optional = true

[tool.poetry.group.unit.dependencies]
pytest = ">=9.1.1"
coverage = { extras = ["toml"], version = ">7.0" }
ops = { version = "^3.8.1", extras = ["testing"] }

[tool.poetry.group.integration]
optional = true

[tool.poetry.group.integration.dependencies]
pytest = ">=9.1.1"
boto3 = ">=1.43.80"
tenacity = "^9.1.4"
spark8t = "^1.4.0"
spark-k8s-test = "^0.0.4"
jubilant = "^1.12.0"
tomli = "^2.4.1"
tomli-w = "^1.2.0"
python-dotenv = "^1.2.3"

[tool.poetry.group.build-refresh-version]
optional = true

[tool.poetry.group.build-refresh-version.dependencies]
charm-refresh-build-version = "^0.4.1"

[tool.ruff]
line-length = 99
extend-exclude = ["__pycache__", "*.egg_info"]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "C", "N", "D", "I001"]
ignore = ["E501", "D107"]
per-file-ignores = { "tests/*" = ["D100", "D101", "D102", "D103", "D104", "E999"], "src/literals.py" = ["D101"], "src/*/__init__.py" = ["D104"] }
extend-ignore = [
  "D203",
  "D204",
  "D213",
  "D215",
  "D400",
  "D401",
  "D404",
  "D406",
  "D407",
  "D408",
  "D409",
  "D413",
]
mccabe.max-complexity = 10

[tool.mypy]
exclude = [
  "lib",
]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
  "charms.data_platform_libs.*",
  "charms.grafana_k8s.*",
  "charms.loki_k8s.*",
  "charms.prometheus_k8s.*",
  "charms.tls_certificates_interface.*",
  "charms.certificate_transfer_interface.*",
  "charms.glauth_k8s.*",
  "charms.spark_integration_hub_k8s.*",
  "spark8t.services",
  "charm_refresh",
]
ignore_missing_imports = true

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = ["unstable"]

[tool.pyright]
include = ["src"]
extraPaths = ["./lib", "src"]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportIncompatibleMethodOverride = false
reportImportCycles = false
reportMissingModuleSource = true
stubPath = ""
