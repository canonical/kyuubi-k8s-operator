name: kyuubi-k8s
display-name: Kyuubi K8s
summary: Kubernetes based charm for the Apache Kyuubi
description: |
  This is a charm for Apache Kyuubi.

  It provides users with a JDBC endpoint so that users can use
  JDBC compliant tools to execute queries against Apache Spark cluster.

  Apache Kyuubi is a free, open source software project by the Apache Software Foundation.
  Users can find out more at the [Kyuubi project page](https://kyuubi.apache.org/).
docs: https://canonical-charmed-spark.readthedocs-hosted.com/main/how-to/apache-kyuubi
source: https://github.com/canonical/kyuubi-k8s-operator
issues: https://github.com/canonical/kyuubi-k8s-operator/issues
website:
  - https://ubuntu.com/data/spark
  - https://canonical.com/data/docs/spark/k8s
  - https://charmhub.io/kyuubi-k8s
  - https://github.com/canonical/kyuubi-k8s-operator
  - https://matrix.to/#/%23charmhub-analytics%3Aubuntu.com
maintainers:
  - Canonical Data Platform <data-platform@lists.launchpad.net>

assumes:
  - k8s-api
  - juju >= 3.6

charm-user: non-root

containers:
  kyuubi:
    resource: kyuubi-image
    uid: 584792
    gid: 584792

resources:
  kyuubi-image:
    type: oci-image
    description: OCI image for kyuubi
    # oci-tag=3.4-22.04_edge
    upstream-source: ghcr.io/canonical/charmed-spark-kyuubi@sha256:4b75602a6b3990f202476dbe0212c669a5a8e2e8f5a4d4eca0fdacfb9e5bc065 # 3.4-22.04 24-06-2026

peers:
  kyuubi-peers:
    interface: kyuubi-peers
  refresh-v-three:
    interface: refresh

requires:
  auth-db:
    interface: postgresql_client
    limit: 1
    optional: true
  ldap-credentials:
    interface: ldap
    limit: 1
    optional: true
  spark-service-account:
    interface: spark_service_account
    limit: 1
  metastore-db:
    interface: postgresql_client
    limit: 1
    optional: true
  zookeeper:
    interface: zookeeper
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
    limit: 1
    optional: true
  certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  service-mesh:
    limit: 1
    interface: service_mesh
    description: |
      Integrate this charm into a service mesh
    optional: true
  require-cmr-mesh:
    interface: cross_model_mesh
    description: |
      If this app relates to other applications on a charmed service mesh cross-model, use this relation to send that related app additional data needed to automatically generate traffic authorization policies.  This is required because Juju does not natively provide all information required to build these policies when related cross-model.
    optional: true

provides:
  jdbc:
    interface: kyuubi_client
  metrics-endpoint:
    interface: prometheus_scrape
  grafana-dashboard:
    interface: grafana_dashboard
  provide-cmr-mesh:
    interface: cross_model_mesh
    description: |
      If this app is generating policies to provide access to related applications that are cross-model, relate that app to this additional relation to retrieve additional data required for these policies.  This is required because Juju does not natively provide all information required to build these policies when related cross-model.
    optional: true